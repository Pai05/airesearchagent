<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results | AI Research Agent</title>
    <link rel="stylesheet" href="src/styles/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="grid-bg"></div>

    <!-- HEADER: same as index.html but "Search" is active -->
    <header>
        <div class="container">
            <nav>
                <div class="logo">RESEARCHLENS</div>

                <div class="nav-links">
                    <a href="index.html" class="nav-link active">Discover</a>
                    <a href="#" class="nav-link">Library</a>
                    <a href="#" class="nav-link">Analytics</a>
                </div>

                <div class="auth-btns">
                    <span style="color: var(--text-muted); font-size: 0.75rem; letter-spacing: 0.5px;">RESEARCHER@UNIVERSITY.EDU</span>
                    <div class="header-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
                    </div>
                    <div class="header-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                    </div>
                    <div class="user-avatar-small"><img src="https://i.pravatar.cc/32?img=68" alt="User"></div>
                    <a href="login.html" class="nav-link" style="font-size: 0.75rem; font-weight: 800; letter-spacing: 1px;">SIGN OUT</a>
                </div>
            </nav>
        </div>
    </header>

    <main class="container">
        <!-- Results Search Bar (compact, at top) -->
        <section style="padding: 2rem 0 1.5rem; text-align: center; border-bottom: 1px solid var(--border); margin-bottom: 2rem;">
            <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem;">
                <a href="index.html" style="color: var(--text-muted); font-size: 0.75rem; text-decoration: none; display: flex; align-items: center; gap: 0.4rem;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
                    Back to Search
                </a>
                <span style="color: var(--border);">|</span>
                <span style="font-size: 0.7rem; color: var(--text-muted); letter-spacing: 1px; font-weight: 700;">RESULTS FOR:</span>
                <span id="topic-label" style="font-size: 0.8rem; color: var(--accent-cyan); font-weight: 700;"></span>
            </div>

            <!-- Compact Search Bar for refining -->
            <div class="search-box-outer" style="margin: 0 auto;">
                <div class="search-box-inner">
                    <div class="search-icon-left">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                    </div>
                    <input type="text" id="search-input" placeholder="Refine or search a new topic...">
                    <button id="search-button" class="search-btn-cyan">SEARCH</button>
                </div>
                <!-- Loading bar -->
                <div id="fetching-bar" class="hidden">
                    <div class="loading-spinner-small"></div>
                    <span>Fetching papers... this may take 20–30 seconds</span>
                </div>
            </div>
        </section>

        <!-- Stats bar -->
        <div style="margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem; font-size: 0.75rem; color: var(--text-muted);">
            FOUND <strong id="results-count" style="color: var(--accent-cyan); margin: 0 0.3rem;">0</strong> RELEVANT PAPERS
            <span id="fetching-status" style="color: var(--accent-cyan); font-style: italic; margin-left: 1rem;"></span>
        </div>

        <!-- 3-Column Results Layout -->
        <div class="main-layout">
            <!-- Filters Column -->
            <aside id="filters-container"></aside>

            <!-- Papers Column -->
            <section>
                <div id="gap-graph-container"></div>
                <div id="paper-list-container"></div>
            </section>

            <!-- Global Analysis Sidebar -->
            <aside id="sidebar-container" class="synthesized-panel"></aside>
        </div>
    </main>

    <script type="module" src="src/results_main.js"></script>
</body>
</html>
